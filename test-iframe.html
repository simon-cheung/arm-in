<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
        background: #1a1a1a;
        color: #fff;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 20px;
      }
      h2 {
        font-size: 14px;
        margin: 18px 0 10px;
        color: #ccc;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 6px;
        color: #aaa;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #2a2a2a;
        color: #fff;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 13px;
      }
      textarea {
        min-height: 160px;
        resize: vertical;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #0066cc;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #0052a3;
      }
      button:disabled {
        background: #444;
        cursor: not-allowed;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        min-height: 18px;
        white-space: pre-wrap;
      }
      .status.ok {
        color: #4ade80;
      }
      .status.err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upsert File to Workspace</h1>

      <h2>Single file</h2>
      <label for="fileNameInput">File name</label>
      <input type="text" id="fileNameInput" placeholder="hello.txt, AGENTS.md, or foo.zip" value="hello.txt" />

      <label for="contentInput">URL the backend will download (file content if non-zip, zip if .zip)</label>
      <textarea id="contentInput" placeholder="https://example.com/path/to/hello.txt">
https://raw.githubusercontent.com/octocat/Hello-World/master/README</textarea
      >

      <button id="saveBtn" onclick="sendUpsertMessage()">Save Single File</button>

      <h2>Batch (JSON array)</h2>
<label for="batchInput">Files as JSON array: [{ fileName, url }, ...] — each url is a URL</label>
      <textarea id="batchInput" placeholder='[{"fileName":"a.txt","url":"https://..."},{"fileName":"b.zip","url":"https://.../b.zip"}]'>
[
  { "fileName": "batch-a.txt", "url": "https://raw.githubusercontent.com/octocat/Hello-World/master/README" },
  { "fileName": "batch-b.txt", "url": "https://raw.githubusercontent.com/octocat/Spoon-Knife/master/README.md" }
]</textarea
      >
[
  { "fileName": "batch-a.txt", "content": "https://raw.githubusercontent.com/octocat/Hello-World/master/README" },
  { "fileName": "batch-b.txt", "content": "https://raw.githubusercontent.com/octocat/Spoon-Knife/master/README.md" }
]</textarea
      >

      <button id="batchBtn" onclick="sendBatchUpsertMessage()">Save Batch</button>

      <div id="status" class="status"></div>
    </div>
    <script>
      const fileNameInput = document.getElementById("fileNameInput")
      const contentInput = document.getElementById("contentInput")
      const saveBtn = document.getElementById("saveBtn")
      const batchInput = document.getElementById("batchInput")
      const batchBtn = document.getElementById("batchBtn")
      const statusEl = document.getElementById("status")

      function setStatus(text, kind) {
        statusEl.textContent = text || ""
        statusEl.className = "status" + (kind ? " " + kind : "")
      }

      function validateUrl(fileName, url) {
        if (!url) return `${fileName}: url is required`
        if (!/^https?:\/\//.test(url)) return `${fileName}: url must start with http:// or https://`
        return null
      }

      function sendMessage(payload, ackKey, label) {
        return new Promise((resolve, reject) => {
          const handler = (e) => {
            if (e.data?.action !== "ARMIN_UPSERT_DONE") return
            if (e.data.fileName !== ackKey) return
            window.removeEventListener("message", handler)
            clearTimeout(timer)
            if (e.data.ok) resolve(e.data)
            else reject(new Error(e.data.error || "upsert failed"))
          }
          window.addEventListener("message", handler)
          const timer = setTimeout(() => {
            window.removeEventListener("message", handler)
            reject(new Error("timeout waiting for parent ack"))
          }, 60000)
          window.parent.postMessage(payload, "*")
        })
      }

      async function sendUpsertMessage() {
        const fileName = fileNameInput.value.trim()
        const url = contentInput.value.trim()
        if (!fileName) {
          setStatus("File name is required", "err")
          return
        }
        const err = validateUrl(fileName, url)
        if (err) {
          setStatus(err, "err")
          return
        }
        saveBtn.disabled = true
        batchBtn.disabled = true
        const kind = fileName.toLowerCase().endsWith(".zip") ? "extracting" : "downloading"
        setStatus(`Sending ${fileName} to parent (parent will ${kind})…`, "")
        try {
          await sendMessage({ action: "ARMIN_UPSERT_FILE", url, fileName }, fileName, fileName)
          setStatus(`Saved ${fileName}`, "ok")
        } catch (err) {
          setStatus(`Failed: ${err.message}`, "err")
        } finally {
          saveBtn.disabled = false
          batchBtn.disabled = false
        }
      }

      async function sendBatchUpsertMessage() {
        const raw = batchInput.value.trim()
        if (!raw) {
          setStatus("Batch input is empty", "err")
          return
        }
        let files
        try {
          files = JSON.parse(raw)
        } catch (err) {
          setStatus("Invalid JSON: " + err.message, "err")
          return
        }
        if (!Array.isArray(files) || files.length === 0) {
          setStatus("Batch must be a non-empty JSON array", "err")
          return
        }
        for (const f of files) {
          if (!f || typeof f.fileName !== "string" || typeof f.url !== "string") {
            setStatus("Each entry must be { fileName: string, url: string }", "err")
            return
          }
          f.url = f.url.trim()
          const err = validateUrl(f.fileName, f.url)
          if (err) {
            setStatus(err, "err")
            return
          }
        }
        const zipCount = files.filter((f) => f.fileName.toLowerCase().endsWith(".zip")).length
        if (zipCount > 1 || (zipCount === 1 && files.length > 1)) {
          setStatus(
            "Batch must be all plain files or exactly one .zip (got " +
              zipCount +
              " zip in " +
              files.length +
              " files)",
            "err",
          )
          return
        }
        const ackKey = files.length === 1 ? files[0].fileName : `<batch:${files.length}>`
        saveBtn.disabled = true
        batchBtn.disabled = true
        setStatus(`Sending batch of ${files.length} files (ack key: ${ackKey})…`, "")
        try {
          await sendMessage({ action: "ARMIN_UPSERT_FILE", files }, ackKey, ackKey)
          const summary = files.map((f) => `  ${f.fileName}: ok`).join("\n")
          setStatus(`Batch saved (${files.length} files)\n${summary}`, "ok")
        } catch (err) {
          setStatus(`Batch failed: ${err.message}`, "err")
        } finally {
          saveBtn.disabled = false
          batchBtn.disabled = false
        }
      }
    </script>
  </body>
</html>

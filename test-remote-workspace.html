<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
        background: #1a1a1a;
        color: #fff;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #2a2a2a;
        color: #fff;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #0066cc;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #0052a3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Open Remote Workspace</h1>
      <input type="text" id="urlInput" placeholder="https://example.com/repo.zip" />
      <button onclick="sendDownloadMessage()">Open as Workspace</button>
    </div>
    <script>
      function sendDownloadMessage() {
        const url = document.getElementById("urlInput").value.trim()
        if (!url) {
          alert("Please enter a URL")
          return
        }
        const urlObj = new URL(url)
        const segments = urlObj.pathname.split("/").filter(Boolean)
        const filename = segments[segments.length - 1] || "download"
        const suggestedName = filename.endsWith(".zip") ? filename.slice(0, -4) : filename

        window.parent.postMessage(
          {
            action: "download",
            url: url,
            suggestedName: suggestedName,
          },
          "*",
        )
      }
    </script>
  </body>
</html>
